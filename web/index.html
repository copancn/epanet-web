<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="app.title">管网水力模拟 · EPANET Web</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">💧</span>
    <div>
      <div class="title" data-i18n="brand.title">管网水力模拟</div>
      <div class="subtitle" data-i18n="brand.subtitle">EPANET Web · Go 引擎</div>
    </div>
  </div>
  <div class="engine-badge" id="engineBadge">引擎检测中…</div>
  <div class="spacer"></div>
  <div class="actions">
    <button class="btn btn-icon" id="btnUndo" data-i18n-title="btn.undo" title="撤销 (Ctrl+Z)" disabled>↶</button>
    <button class="btn btn-icon" id="btnRedo" data-i18n-title="btn.redo" title="重做 (Ctrl+Shift+Z)" disabled>↷</button>
    <button class="btn btn-icon" id="btnTheme" title="切换暗色模式">☾</button>
    <select id="langSelect" class="lang-select" title="Language / 语言">
      <option value="zh">中文</option>
      <option value="en">English</option>
    </select>
    <button class="btn" id="btnExample" data-i18n="btn.example">示例管网</button>
    <button class="btn" id="btnNew" data-i18n="btn.new">新建</button>
    <button class="btn" id="btnOpen" data-i18n="btn.open">打开工程</button>
    <button class="btn" id="btnSave" data-i18n="btn.save">保存工程</button>
    <button class="btn" id="btnImport" data-i18n="btn.import">导入 INP</button>
    <button class="btn" id="btnGis" data-i18n="btn.gis">导入 GIS</button>
    <button class="btn" id="btnExport" data-i18n="btn.export">导出 INP</button>
    <button class="btn" id="btnData" data-i18n="btn.data">模式/曲线/控制</button>
    <button class="btn" id="btnReview" data-i18n="btn.review">检查</button>
    <button class="btn btn-run" id="btnRun">▶ 运行模拟</button>
  </div>
</header>

<div class="resultbar" id="resultBar" hidden>
  <label class="rb-group rb-color">
    <input type="checkbox" id="chkColorByValue">
    <span data-i18n="rb.colorByValue">数值着色</span>
  </label>
  <div class="rb-group">
    <label data-i18n="rb.nodeColor">节点着色</label>
    <select id="nodeColor">
      <option value="pressure" data-i18n="opt.pressure">压力</option>
      <option value="head" data-i18n="opt.head">水头</option>
      <option value="demand" data-i18n="opt.demand">需水量</option>
      <option value="quality" data-i18n="opt.quality">水质</option>
      <option value="level" data-i18n="opt.level">水位</option>
      <option value="demandDeficit" data-i18n="opt.deficit">需水缺口</option>
    </select>
  </div>
  <div class="rb-group">
    <label data-i18n="rb.linkColor">管段着色</label>
    <select id="linkColor">
      <option value="flow" data-i18n="opt.flow">流量</option>
      <option value="velocity" data-i18n="opt.velocity">流速</option>
      <option value="headloss" data-i18n="opt.headloss">水头损失</option>
      <option value="status" data-i18n="opt.status">状态</option>
      <option value="energy" data-i18n="opt.energy">能耗</option>
      <option value="efficiency" data-i18n="opt.efficiency">效率</option>
      <option value="setting" data-i18n="opt.setting">设定值</option>
    </select>
  </div>
  <div class="rb-group rb-time">
    <button class="btn btn-icon" id="btnPlay">▶</button>
    <input type="range" id="timeSlider" min="0" max="0" value="0" step="1">
    <span class="time-label" id="timeLabel">t = 00:00</span>
  </div>
  <div class="rb-legend" id="legend"></div>
  <div class="spacer"></div>
  <button class="btn" id="btnExportCsv" data-i18n="rb.exportCsv">导出 CSV</button>
  <button class="btn" id="btnChart" data-i18n="rb.chart">图表</button>
  <button class="btn" id="btnReport" data-i18n="btn.report">导出报告</button>
  <button class="btn" id="btnCloseResults" data-i18n="btn.closeResults">关闭结果</button>
</div>

<main class="workspace">
  <aside class="left">
    <div class="panel-title" data-i18n="tools.title">绘图工具</div>
    <div class="tools" id="tools">
      <button class="tool active" data-tool="select" data-i18n="tool.select" data-i18n-title="tool.select.title" title="选择/移动 (V)">⬚ 选择</button>
      <button class="tool" data-tool="junction" data-i18n="tool.junction" data-i18n-title="tool.junction.title" title="节点 (J)">● 节点</button>
      <button class="tool" data-tool="reservoir" data-i18n="tool.reservoir" data-i18n-title="tool.reservoir.title" title="水库 (R)">▰ 水库</button>
      <button class="tool" data-tool="tank" data-i18n="tool.tank" data-i18n-title="tool.tank.title" title="水池 (T)">▮ 水池</button>
      <button class="tool" data-tool="pipe" data-i18n="tool.pipe" data-i18n-title="tool.pipe.title" title="管道 (P)">─ 管道</button>
      <button class="tool" data-tool="pump" data-i18n="tool.pump" data-i18n-title="tool.pump.title" title="水泵 (M)">⊕ 水泵</button>
      <button class="tool" data-tool="valve" data-i18n="tool.valve" data-i18n-title="tool.valve.title" title="阀门 (A)">⋈ 阀门</button>
    </div>
    <div class="panel-title" data-i18n="legend.title">图例</div>
    <div class="type-legend">
      <div><span class="dot j"></span><span data-i18n="legend.junction">节点</span></div>
      <div><span class="dot r"></span><span data-i18n="legend.reservoir">水库</span></div>
      <div><span class="dot t"></span><span data-i18n="legend.tank">水池</span></div>
      <div><span class="line p"></span><span data-i18n="legend.pipe">管道</span></div>
      <div><span class="line m"></span><span data-i18n="legend.pump">水泵</span></div>
      <div><span class="line v"></span><span data-i18n="legend.valve">阀门</span></div>
    </div>
    <div class="panel-title">
      <span data-i18n="elem.title">元素</span>
      <span class="count" id="elemCount"></span>
    </div>
    <div class="elem-tabs">
      <button class="etab active" data-etab="nodes" data-i18n="etab.nodes">节点</button>
      <button class="etab" data-etab="links" data-i18n="etab.links">管段</button>
    </div>
    <div class="elem-list" id="elemList"></div>
  </aside>

  <section class="canvas-wrap">
    <canvas id="canvas"></canvas>
    <div class="canvas-hint" id="canvasHint">选择工具开始绘图 · 滚轮缩放 · 拖拽平移</div>
    <div class="zoom-ctl">
      <button class="btn btn-icon" id="btnZoomIn">＋</button>
      <button class="btn btn-icon" id="btnZoomOut">－</button>
      <button class="btn btn-icon" id="btnFit" data-i18n-title="fit.title" title="适应窗口">⤢</button>
    </div>
    <div class="map-ctl">
      <button class="btn btn-icon" id="btnMapToggle" data-i18n-title="map.toggle.title" title="地图图层">🗺</button>
      <button class="btn btn-icon" id="btnMapSettings" data-i18n-title="map.settings" title="地图设置">⚙</button>
    </div>
    <div class="map-panel" id="mapPanel" hidden></div>
    <div class="map-attribution" id="mapAttribution" hidden></div>
    <div class="coord-readout" id="coordReadout"></div>
    <div class="canvas-tip" id="canvasTip" hidden></div>
  </section>

  <aside class="right">
    <div class="rtabs">
      <button class="rtab active" data-rtab="props" data-i18n="rtab.props">属性</button>
      <button class="rtab" data-rtab="settings" data-i18n="rtab.settings">模拟设置</button>
    </div>
    <div class="rpanel" id="propsPanel">
      <div class="empty-hint" id="propsEmpty" data-i18n-html="props.empty">未选中元素。<br>用「选择」工具点击节点或管段查看/编辑属性。</div>
      <div id="propsForm"></div>
    </div>
    <div class="rpanel" id="settingsPanel" hidden></div>
  </aside>
</main>

<footer class="resultspanel" id="resultsPanel" hidden>
  <div class="rp-head">
    <div class="rp-tabs">
      <button class="rptab active" data-rptab="nodes" data-i18n="rptab.nodes">节点结果</button>
      <button class="rptab" data-rptab="links" data-i18n="rptab.links">管段结果</button>
      <button class="rptab" data-rptab="stats" data-i18n="rptab.stats">统计</button>
      <button class="rptab" data-rptab="report" data-i18n="rptab.report">报告</button>
      <button class="rptab" data-rptab="warnings" data-i18n="rptab.warnings">警告</button>
    </div>
    <div class="spacer"></div>
    <span class="rp-summary" id="rpSummary"></span>
    <button class="btn btn-icon" id="btnToggleResults" data-i18n-title="toggle.title" title="折叠/展开">▾</button>
  </div>
  <div class="rp-body" id="rpBody">
    <div class="table-wrap" id="nodeTableWrap"></div>
    <div class="table-wrap" id="linkTableWrap" hidden></div>
    <div class="table-wrap" id="statsWrap" hidden></div>
    <div class="table-wrap" id="reportWrap" hidden></div>
    <div class="warnings-wrap" id="warningsWrap" hidden></div>
  </div>
</footer>

<!-- Data editor modal -->
<div class="modal-overlay" id="dataModal" hidden>
  <div class="modal">
    <div class="modal-head">
      <span data-i18n="modal.title">时间模式 · 数据曲线 · 控制规则</span>
      <button class="btn btn-icon" id="btnCloseData">✕</button>
    </div>
    <div class="modal-body">
      <div class="data-section">
        <div class="data-head"><span data-i18n="data.patterns">时间模式（需水乘数，逗号分隔）</span><button class="btn btn-sm" id="btnAddPattern" data-i18n="btn.add">+ 添加</button></div>
        <div id="patternList"></div>
      </div>
      <div class="data-section">
        <div class="data-head"><span data-i18n="data.curves">数据曲线（水泵扬程曲线等，每行 x,y）</span><button class="btn btn-sm" id="btnAddCurve" data-i18n="btn.add">+ 添加</button></div>
        <div id="curveList"></div>
      </div>
      <div class="data-section">
        <div class="data-head"><span data-i18n="data.controls">控制规则（结构化构建）</span><button class="btn btn-sm" id="btnAddControl" data-i18n="ctl.add">+ 添加规则</button></div>
        <div id="controlList"></div>
      </div>
      <div class="data-section">
        <div class="data-head"><span data-i18n="data.rules">规则控制（RULES，基于条件）</span><button class="btn btn-sm" id="btnAddRule" data-i18n="btn.addRule">+ 添加规则</button></div>
        <div id="ruleList"></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-run" id="btnApplyData" data-i18n="btn.apply">应用</button>
    </div>
  </div>
</div>

<input type="file" id="fileInp" accept=".inp,.txt" hidden>
<input type="file" id="fileJson" accept=".json" hidden>
<input type="file" id="fileGis" accept=".geojson,.json,.csv" hidden>
<div class="modal-overlay" id="reviewModal" hidden>
  <div class="modal">
    <div class="modal-head">
      <span data-i18n="review.title">管网检查</span>
      <button class="btn btn-icon" id="btnCloseReview">✕</button>
    </div>
    <div class="modal-body">
      <div class="rp-summary" id="reviewSummary"></div>
      <div id="reviewList"></div>
    </div>
    <div class="modal-foot">
      <button class="btn" id="btnFixAll" data-i18n="review.fixAll">全部修复</button>
      <button class="btn" id="btnCloseReview2" data-i18n="btn.close">关闭</button>
    </div>
  </div>
</div>
<div class="modal-overlay" id="chartModal" hidden>
  <div class="modal">
    <div class="modal-head">
      <span id="chartTitle">—</span>
      <button class="btn btn-icon" id="btnCloseChart">✕</button>
    </div>
    <div class="modal-body">
      <canvas id="chartCanvas" style="width:100%;height:280px;display:block;"></canvas>
    </div>
    <div class="modal-foot">
      <button class="btn" id="btnCloseChart2" data-i18n="btn.close">关闭</button>
    </div>
  </div>
</div>
<div class="modal-overlay" id="gisModal" hidden>
  <div class="modal">
    <div class="modal-head">
      <span data-i18n="gis.title">GIS 导入（GeoJSON / CSV）</span>
      <button class="btn btn-icon" id="btnCloseGis">✕</button>
    </div>
    <div class="modal-body" id="gisBody"></div>
    <div class="modal-foot">
      <button class="btn btn-run" id="btnGisImport" data-i18n="gis.import">导入</button>
      <button class="btn" id="btnCloseGis2" data-i18n="btn.close">关闭</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
